name: libraspace
description: Find available library seats near you.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '^3.12.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.5
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.0
  cloud_firestore: ^5.4.0
  firebase_messaging: ^15.1.3
  provider: ^6.0.5
  geolocator: ^13.0.0
  mobile_scanner: ^5.0.0
  google_fonts: ^6.2.1
  cached_network_image: ^3.2.3
  percent_indicator: ^4.2.2
  fluttertoast: ^9.1.0
  intl: ^0.19.0
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
